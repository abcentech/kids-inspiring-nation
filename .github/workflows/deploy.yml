name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install deterministic speech engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak libespeak1 ffmpeg
      - name: Generate chapter recordings with word-level timing
        run: |
          python3 scripts/build-red-letters-audio.py \
            --data public/words-of-christ/data.json \
            --out dist/words-of-christ/audio \
            --voice english_rp --rate 154
          test -s dist/words-of-christ/audio/index.json
          test -s dist/words-of-christ/audio/john-01.mp3
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
